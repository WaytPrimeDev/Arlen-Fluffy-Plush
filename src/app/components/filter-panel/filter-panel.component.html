<div class="filter-panel">
  <button
    type="button"
    class="filter-panel__trigger"
    [class.filter-panel__trigger--active]="activeCount() > 0"
    [class.filter-panel__trigger--open]="isOpen()"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-haspopup]="'dialog'"
    aria-controls="filter-panel-popover"
    (click)="toggle()"
  >
    <svg
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
      focusable="false"
    >
      <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3" />
    </svg>
    <span>{{ triggerLabel() || ('filterAndSort' | translate) }}</span>
    @if (activeCount() > 0) {
      <span class="filter-panel__badge">{{ activeCount() }}</span>
    }
    <svg
      class="filter-panel__chevron"
      [class.filter-panel__chevron--open]="isOpen()"
      width="14"
      height="14"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.4"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
      focusable="false"
    >
      <polyline points="6 9 12 15 18 9" />
    </svg>
  </button>

  @if (activeChips().length > 0) {
    <ul class="filter-panel__chips" [attr.aria-label]="'activeFilters' | translate">
      @for (chip of activeChips(); track chip.key) {
        <li class="filter-panel__chip">
          <span class="filter-panel__chip-label">{{ chip.label }}:</span>
          <span class="filter-panel__chip-value">{{ chip.valueLabel }}</span>
          <button
            type="button"
            class="filter-panel__chip-remove"
            [attr.aria-label]="('removeFilter' | translate) + ' ' + chip.label"
            (click)="removeChip(chip.key)"
          >
            <svg
              width="12"
              height="12"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </li>
      }
      <li>
        <button
          type="button"
          class="filter-panel__clear-all"
          (click)="onResetAll()"
        >
          {{ 'resetAllFilters' | translate }}
        </button>
      </li>
    </ul>
  }

  @if (isOpen()) {
    <div
      id="filter-panel-popover"
      class="filter-panel__popover"
      role="dialog"
      [attr.aria-label]="'filterAndSort' | translate"
    >
      <div class="filter-panel__grid">
        @for (filter of filters(); track filter.key) {
          <div class="filter-panel__field">
            <span class="filter-panel__field-label">{{ filter.label }}</span>
            <app-select
              [options]="filter.options"
              [value]="filter.value"
              [ariaLabel]="filter.label"
              (valueChange)="onSelect(filter.key, $event)"
            />
          </div>
        }
      </div>
      @if (activeCount() > 0) {
        <div class="filter-panel__actions">
          <button
            type="button"
            class="filter-panel__reset"
            (click)="onResetAll()"
          >
            {{ 'resetAllFilters' | translate }}
          </button>
        </div>
      }
    </div>
  }
</div>
