<header class="app-topbar">
  <a class="app-topbar__brand" routerLink="/"
    ><img
      src="./assets/img/navigation/photo_2024-08-31_20-45-32.png"
      alt="Arlen Fluffy Plush"
      width="60"
      height="60"
    /><span class="app-topbar__brand-text">Arlen Fluffy Plush</span></a
  >
  <nav class="app-topbar__nav" aria-label="Main menu">
    <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }"
      >{{ 'home' | translate }}</a
    >
    <a routerLink="/kittens" routerLinkActive="is-active">{{ 'kittens' | translate }}</a>
    <a routerLink="/parents" routerLinkActive="is-active">{{ 'parents' | translate }}</a>
    <a routerLink="/families" routerLinkActive="is-active">{{ 'families' | translate }}</a>
  </nav>
  <app-language-switcher></app-language-switcher>
</header>

<main class="app-content">
  <router-outlet />
</main>
