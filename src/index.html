<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Title, description, canonical, Open Graph and JSON-LD are written per
         route and per language by SeoService, during server-side rendering too. -->
    <!-- Fallback for the few clients that read the HTML before Angular runs;
         every rendered response carries the per-route copy instead. -->
    <title>Arlen Fluffy Plush — розплідник кошенят / kitten cattery</title>
    <meta
      name="description"
      content="Розплідник кошенят Arlen Fluffy Plush: кошенята регдол, британські та шотландські з документами WCF. Kitten cattery in Ternopil, Ukraine."
    />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#7356a8" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png" />
    <!-- iOS paints transparency black, so this icon carries a solid background. -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <!-- Only gstatic is preconnected: the build inlines this stylesheet into the
         document, so googleapis is never actually requested in production and a
         hint for it would just hold an unused connection open. -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
      rel="stylesheet"
    />
    <!-- Google Tag Manager -->
    <!-- Nothing is requested until the visitor accepts the cookie notice.
         `CookieConsentService` calls `__grantAnalyticsConsent()` below — on a
         click of Accept, or straight away on a later visit where the stored
         decision is already a yes. Refusing, or not answering at all, leaves
         the container unfetched: no gtm.js, no GA cookies, no network call.

         `dataLayer` is still created immediately, which is all
         AnalyticsService needs — it queues events into the array, and nothing
         is sent while the container is absent. Consent Mode v2 defaults are
         pushed before anything else so that a container configured to honour
         them starts out denied rather than granted.

         Once consent is on record the container is still kept off the critical
         path: half a megabyte of script loaded with the page lands in the
         middle of the hero image download and pushes LCP out. Whichever comes
         first wins — the visitor touching the page, since they are about to
         produce events worth sending; the main thread falling idle; or a
         timeout after load, for browsers without idle callbacks. -->
    <script>
      (function (w, d, s, l, i) {
        w[l] = w[l] || [];

        function gtag() {
          w[l].push(arguments);
        }

        gtag('consent', 'default', {
          ad_storage: 'denied',
          ad_user_data: 'denied',
          ad_personalization: 'denied',
          analytics_storage: 'denied',
          // The site's own two cookies: a language code and the decision
          // itself. Neither is analytics, and the site cannot work without
          // remembering them.
          functionality_storage: 'granted',
          security_storage: 'granted',
          wait_for_update: 500,
        });

        var triggers = ['pointerdown', 'keydown', 'touchstart', 'scroll'];
        var loaded = false;

        function load() {
          if (loaded) {
            return;
          }
          loaded = true;

          triggers.forEach(function (name) {
            w.removeEventListener(name, load, true);
          });

          w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });

          var f = d.getElementsByTagName(s)[0],
            j = d.createElement(s),
            dl = l != 'dataLayer' ? '&l=' + l : '';
          j.async = true;
          j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl;
          f.parentNode.insertBefore(j, f);
        }

        function schedule() {
          if (w.requestIdleCallback) {
            w.requestIdleCallback(load, { timeout: 3000 });
          } else {
            w.setTimeout(load, 2500);
          }
        }

        var armed = false;

        w.__grantAnalyticsConsent = function () {
          if (armed) {
            return;
          }
          armed = true;

          gtag('consent', 'update', { analytics_storage: 'granted' });

          triggers.forEach(function (name) {
            w.addEventListener(name, load, { capture: true, once: true, passive: true });
          });

          if (d.readyState === 'complete') {
            schedule();
          } else {
            w.addEventListener('load', schedule);
          }
        };
      })(window, document, 'script', 'dataLayer', 'GTM-KMX2RSN4');
    </script>
    <!-- End Google Tag Manager -->
  </head>
  <body>
    <!-- No GTM <noscript> fallback: with scripting off there is no way to ask
         for consent, so the container must not be loaded at all. -->
    <app-root></app-root>
  </body>
</html>
